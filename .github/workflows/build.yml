name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip Project
        run: unzip Maro_on_fire_Android_project.zip -d extracted_project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: |
          cd extracted_project/MaroOnFireAndroid
          chmod +x gradlew || true

      - name: Build APK with Gradle
        run: |
          cd extracted_project/MaroOnFireAndroid
          gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: extracted_project/MaroOnFireAndroid/app/build/outputs/apk/debug/app-debug.apk
